name: Epic
description: A large delivery. Write in plain language everyone understands.
title: "[Epic] "
labels: ["type:epic"]
body:
  - type: textarea
    id: delivers
    attributes:
      label: What is delivered
      description: Plain language, no technical terms.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is needed
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How we know it is done
    validations:
      required: true
