name: Task
description: A concrete technical work package. One task becomes one branch and one PR.
title: "[Task] "
labels: ["type:task"]
body:
  - type: textarea
    id: what
    attributes:
      label: What to do
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Fill in all three lines, write "none" if there are none.
      value: |
        **Files to change:**
        **Files to create:**
        **Files read-only:**
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Must be testable.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Also set the matching size label. Anything larger than m must be split.
      options:
        - size:s
        - size:m
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What the task must not touch.
    validations:
      required: true
