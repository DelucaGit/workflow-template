name: Story
description: A vertical slice a user can try. Write in plain language.
title: "[Story] "
labels: ["type:story"]
body:
  - type: markdown
    attributes:
      value: |
        Reminder: tasks under the story go in the order backend → API → frontend → end-to-end test.
        Set **Blocked by** between them so each task is blocked by the one before.
  - type: textarea
    id: story
    attributes:
      label: As a [who] I want [what] so that [why]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Things a person can see or try. No technical terms.
      placeholder: "- [ ] ..."
    validations:
      required: true
