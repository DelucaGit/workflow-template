name: PRD
description: The goal for one version of the project (technical language allowed)
title: "[PRD] "
labels: ["type:prd"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should this version achieve?
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Who it is for
    validations:
      required: true
  - type: textarea
    id: in-scope
    attributes:
      label: In scope
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: How we measure success
    validations:
      required: true
